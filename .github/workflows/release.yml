name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ssh2's vendored OpenSSL build needs NASM on Windows.
      - name: Install NASM (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          dist="da-${{ matrix.target }}"
          mkdir "$dist"
          cp "target/${{ matrix.target }}/release/da" "$dist/"
          cp README.md "$dist/" 2>/dev/null || true
          tar -czf "$dist.tar.gz" "$dist"
          shasum -a 256 "$dist.tar.gz" > "$dist.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $dist = "da-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/da.exe" "$dist/"
          if (Test-Path README.md) { Copy-Item README.md "$dist/" }
          Compress-Archive -Path $dist -DestinationPath "$dist.zip"
          $h = (Get-FileHash "$dist.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  $dist.zip" | Out-File "$dist.zip.sha256" -Encoding ascii

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            da-${{ matrix.target }}.tar.gz
            da-${{ matrix.target }}.tar.gz.sha256
            da-${{ matrix.target }}.zip
            da-${{ matrix.target }}.zip.sha256
          fail_on_unmatched_files: false
