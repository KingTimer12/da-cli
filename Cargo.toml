[package]
name = "dac-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "da"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
anyhow = "1"
dialoguer = "0.11"
indicatif = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "chrono"] }
walkdir = "2"
dirs = "5"
